<text x="437" y="987" font-family="Inter" font-size="25" font-weight="400" text-anchor="start" fill="#1d1d1b">direction</text>
<rect x="654" y="888" width="290" height="150" rx="14" ry="14" fill="#f3f3f1" stroke="#8a8984" stroke-width="2"/>
