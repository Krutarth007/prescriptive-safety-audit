<text x="1621" y="975" font-family="Inter" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff">E</text>
<text x="1665" y="955" font-family="Inter" font-size="25" font-weight="700" text-anchor="start" fill="#1d1d1b">Equivalent</text>
<text x="1665" y="987" font-family="Inter" font-size="25" font-weight="400" text-anchor="start" fill="#1d1d1b">models</text>
<rect x="1882" y="888" width="290" height="150" rx="14" ry="14" fill="#f3f3f1" stroke="#8a8984" stroke-width="2"/>
