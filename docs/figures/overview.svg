<text x="744" y="955" font-family="Inter" font-size="25" font-weight="700" text-anchor="start" fill="#1d1d1b">Individual</text>
<text x="744" y="987" font-family="Inter" font-size="25" font-weight="400" text-anchor="start" fill="#1d1d1b">benefit</text>
<rect x="961" y="888" width="290" height="150" rx="14" ry="14" fill="#f3f3f1" stroke="#8a8984" stroke-width="2"/>
<circle cx="1007" cy="963" r="30" fill="#1d1d1b"/>
<text x="1007" y="975" font-family="Inter" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff">G</text>
<text x="1051" y="955" font-family="Inter" font-size="25" font-weight="700" text-anchor="start" fill="#1d1d1b">Graded</text>
<text x="1051" y="987" font-family="Inter" font-size="25" font-weight="400" text-anchor="start" fill="#1d1d1b">consequences</text>
<rect x="1268" y="888" width="290" height="150" rx="14" ry="14" fill="#f3f3f1" stroke="#8a8984" stroke-width="2"/>
<circle cx="1314" cy="963" r="30" fill="#1d1d1b"/>
<text x="1314" y="975" font-family="Inter" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff">G</text>
<text x="1358" y="955" font-family="Inter" font-size="25" font-weight="700" text-anchor="start" fill="#1d1d1b">Groups and</text>
<text x="1358" y="987" font-family="Inter" font-size="25" font-weight="400" text-anchor="start" fill="#1d1d1b">settings</text>
<rect x="1575" y="888" width="290" height="150" rx="14" ry="14" fill="#f3f3f1" stroke="#8a8984" stroke-width="2"/>
